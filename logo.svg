<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <!-- Definition of reusable elements and styles -->
  <defs>
    <style>
      .brand-title {
        font-family: 'Montserrat', 'Outfit', 'Helvetica Neue', sans-serif;
        font-weight: 400;
        font-size: 56px;
        fill: #0B1D33;
        letter-spacing: 16px;
        text-anchor: middle;
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Outfit', sans-serif;
        font-weight: 500;
        font-size: 26px;
        fill: #C79A3B;
        letter-spacing: 8px;
        text-anchor: middle;
      }
      .brand-tagline {
        font-family: 'Montserrat', 'Inter', sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #4A5568;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .orbit-ring {
        fill: none;
        stroke: #C79A3B;
        stroke-width: 5;
        stroke-linecap: round;
      }
      .logo-circle {
        fill: none;
        stroke: #0B1D33;
        stroke-width: 6;
      }
      .satellite {
        fill: #C79A3B;
      }
    </style>
    <!-- Mask to create a 3D overlap effect of the orbit going behind the circle -->
    <mask id="orbit-mask">
      <!-- Everything white stays -->
      <rect x="0" y="0" width="600" height="320" fill="#FFFFFF" />
      <!-- Black circle cuts out a small gap where the orbit goes behind -->
      <circle cx="300" cy="90" r="48" fill="#000000" />
    </mask>
  </defs>

  <g id="logo-graphics">
    <!-- 1. The BACK part of the orbit (masked to hide it as it goes behind the circle) -->
    <path class="orbit-ring" d="M 224,124 C 270,142 340,135 365,100 C 375,86 372,72 355,64" mask="url(#orbit-mask)" />
    
    <!-- 2. The main central circle -->
    <circle class="logo-circle" cx="300" cy="90" r="42" />

    <!-- 3. The FRONT part of the orbit (sweeps across the front of the circle) -->
    <path class="orbit-ring" d="M 355,64 C 330,52 270,55 240,78 C 218,95 210,114 224,124" />

    <!-- 4. Satellite Sphere (placed at the top-right trajectory of the orbit) -->
    <circle class="satellite" cx="368" cy="74" r="8" />
  </g>

  <!-- Typography Group -->
  <g id="logo-text">
    <!-- Brand Name: ORBYS -->
    <text x="308" y="195" class="brand-title">ORBYS</text>
    
    <!-- Subtitle: — ASSURANCE — -->
    <!-- Gold line left -->
    <line x1="125" y1="230" x2="200" y2="230" stroke="#C79A3B" stroke-width="2" />
    <!-- Text -->
    <text x="304" y="238" class="brand-subtitle">ASSURANCE</text>
    <!-- Gold line right -->
    <line x1="400" y1="230" x2="475" y2="230" stroke="#C79A3B" stroke-width="2" />

    <!-- Tagline: REGULATORY | QUALITY | VALIDATION | TRAINING -->
    <text x="302" y="285" class="brand-tagline">REGULATORY  |  QUALITY  |  VALIDATION  |  TRAINING</text>
  </g>
</svg>
